[package]
name = "cook"
version = "0.1.0"
edition = "2024"

[features]
default = ["atexit"]
# This turns on exit serialization. You must really know what you're doing if you disable this feature.
atexit = []
ssh = ["openssh", "openssh-sftp-client", "dep:openssh-mux-client-error", "dep:tokio"]

[dependencies]
ctor = "0.6"
kdl.workspace = true
libc = "0.2.177"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
openssh = { workspace = true, optional = true }
openssh-sftp-client = { version = "0.15", optional = true, features = [
    "openssh",
] }
async-trait = "0.1"
erased-serde.workspace = true
typetag.workspace = true
anyhow.workspace = true
walkdir.workspace = true
tracing.workspace = true
globset.workspace = true

openssh-mux-client-error = { version = "0.1.1", optional = true }
tokio = { version = "1.48", features = ["sync", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
futures.workspace = true
